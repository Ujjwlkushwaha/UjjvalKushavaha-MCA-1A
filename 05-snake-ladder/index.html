<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake and Ladder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Snake and Ladder</h1>

  <div class="game">
    <div id="board"></div>

    <div class="panel">
      <p id="turnText"></p>
      <div id="diceBox">-</div>
      <button id="rollBtn">Roll Dice</button>
      <button id="resetBtn">New Game</button>
      <p id="message"></p>
      <p class="legend">🪜 Ladder: climb up<br>🐍 Snake: slide down</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
