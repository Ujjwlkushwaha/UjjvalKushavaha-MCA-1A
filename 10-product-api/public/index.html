<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Product Store</h1>

    <h2>Add a Product</h2>
    <form id="productForm">
      <input type="text" id="name" placeholder="Product name" required>
      <input type="number" id="price" placeholder="Price" min="0" required>
      <input type="number" id="rating" placeholder="Rating (0-5)" min="0" max="5" step="0.1" required>
      <button type="submit">Add</button>
    </form>

    <h2>All Products</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Rating</th></tr>
      </thead>
      <!-- rows are created by script.js (client-side rendering) -->
      <tbody id="productBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
