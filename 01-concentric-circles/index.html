<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concentric Circles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Biggest circle is the parent, smaller ones sit inside it -->
  <div class="circle c30">
    <div class="circle c20">
      <div class="circle c10"></div>
    </div>
  </div>
</body>
